<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex"></head><body><title>Daedalus Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Fraunces:opsz,wght@9..144,500;9..144,650&display=swap">
<style>
/* Layout concept: "a calm instrument" — neutral chrome, the user's app is the colourful thing.
   Colour only encodes state: teal = live/primary, amber = cost, red = risk, green = proof, blue = needs you. */
:root{
  --bg:#F7F7F5; --surface:#FFFFFF; --sunk:#EFEFEC; --line:#E4E4DF; --line-strong:#D3D3CC; --line-input:#7A808A;
  --text:#16181D; --muted:#5D636E; --faint:#636974;
  --accent:#0F766E; --accent-soft:#E3F2EF; --on-accent:#FFFFFF;
  --cost:#9A4507; --cost-soft:#FBF0E2;
  --risk:#B42318; --risk-soft:#FBE9E7;
  --ok:#126B33; --ok-soft:#E6F4EA;
  --needs:#1D4ED8; --needs-soft:#E7EEFC;
  --shadow:0 1px 2px rgba(22,24,29,.06),0 8px 24px rgba(22,24,29,.06);
  /* the user's generated app (Maya's brand, extracted from her screenshot) */
  --app-bg:#F4F1EA; --app-ink:#1F3A2E; --app-card:#FFFFFF; --app-muted:#5C6B63; --app-accent:#1F3A2E; --app-chip:#E6EDE8;
  --ui:"IBM Plex Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --display:"Fraunces",Georgia,"Times New Roman",serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1116; --surface:#151A21; --sunk:#10141A; --line:#262D37; --line-strong:#333B47; --line-input:#6B7482;
  --text:#E8EAED; --muted:#9AA3AF; --faint:#8B95A3;
  --accent:#2DD4BF; --accent-soft:#12302D; --on-accent:#06201D;
  --cost:#F59E0B; --cost-soft:#2E2210;
  --risk:#F97066; --risk-soft:#33171A;
  --ok:#4ADE80; --ok-soft:#12291B;
  --needs:#60A5FA; --needs-soft:#14223A;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
  --app-bg:#1B2420; --app-ink:#E4EEE8; --app-card:#222D28; --app-muted:#A3B3AA; --app-accent:#8FD1AE; --app-chip:#2C3933;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1116; --surface:#151A21; --sunk:#10141A; --line:#262D37; --line-strong:#333B47; --line-input:#6B7482;
  --text:#E8EAED; --muted:#9AA3AF; --faint:#8B95A3;
  --accent:#2DD4BF; --accent-soft:#12302D; --on-accent:#06201D;
  --cost:#F59E0B; --cost-soft:#2E2210;
  --risk:#F97066; --risk-soft:#33171A;
  --ok:#4ADE80; --ok-soft:#12291B;
  --needs:#60A5FA; --needs-soft:#14223A;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
  --app-bg:#1B2420; --app-ink:#E4EEE8; --app-card:#222D28; --app-muted:#A3B3AA; --app-accent:#8FD1AE; --app-chip:#2C3933;
  color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
#root{height:100%}
body{background:var(--bg);color:var(--text);font:15px/1.5 var(--ui);margin:0}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .faint{color:var(--faint)}
h1,h2,h3{text-wrap:balance;margin:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ── shared controls ───────────────────────── */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-strong);background:var(--surface);border-radius:6px;padding:6px 12px;font-weight:500;font-size:14px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--sunk)}
.btn.small{padding:3px 9px;font-size:13px}
.btn.danger{color:var(--risk);border-color:var(--risk)}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-strong);border-radius:999px;padding:3px 11px;font-size:13px;background:var(--surface)}
.chip.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:600}
button.chip:hover{border-color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:1px 8px;font-size:12px;font-weight:600;white-space:nowrap}
.pill.cost{background:var(--cost-soft);color:var(--cost)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.risk{background:var(--risk-soft);color:var(--risk)}
.pill.needs{background:var(--needs-soft);color:var(--needs)}
.pill.live{background:var(--accent-soft);color:var(--accent)}
.pill.plain{background:var(--sunk);color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;background:currentColor}
.kbd{font-family:var(--mono);font-size:12px;border:1px solid var(--line-strong);border-bottom-width:2px;border-radius:4px;padding:0 4px;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px}
.label{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}

/* ── prototype chrome (not part of the product) ─── */
.proto{position:fixed;right:12px;bottom:calc(46px + env(safe-area-inset-bottom,0px));z-index:60;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.proto .tag{font:600 12px var(--mono);letter-spacing:.05em;text-transform:uppercase;background:var(--text);color:var(--bg);border-radius:4px;padding:4px 7px}
.proto-menu{position:fixed;right:12px;bottom:calc(88px + env(safe-area-inset-bottom,0px));z-index:61;width:min(320px,calc(100vw - 24px));max-height:70vh;overflow:auto;padding:10px;box-shadow:var(--shadow)}
.proto-menu button{display:flex;width:100%;text-align:left;border:0;background:none;padding:7px 8px;border-radius:6px;gap:8px}
.proto-menu button:hover{background:var(--sunk)}
.proto-menu .grp{margin:8px 8px 4px}

/* ── HOME ──────────────────────────────────── */
.site{min-height:100%;display:flex;flex-direction:column;padding-inline:16px}
.site-top{display:flex;align-items:center;gap:16px;padding-block:14px;max-width:1120px;width:100%;margin:0 auto}
.logo{display:inline-flex;align-items:center;gap:8px;font-weight:700;letter-spacing:-.01em;border:0;background:none;padding:0;font-size:16px}
.logo-mark{width:22px;height:22px;border-radius:5px;background:var(--text);position:relative;flex:none}
.logo-mark::after{content:"";position:absolute;inset:6px;border:2px solid var(--bg);transform:rotate(45deg);border-radius:2px}
.site-top nav{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
.hero{max-width:780px;width:100%;margin:56px auto 0;display:grid;gap:18px}
.hero h1{font-size:clamp(28px,4.4vw,40px);letter-spacing:-.02em;line-height:1.12;font-weight:650}
.hero p.sub{margin:0;color:var(--muted);max-width:60ch}
.composer-big{background:var(--surface);border:1px solid var(--line-strong);border-radius:12px;box-shadow:var(--shadow);overflow:hidden}
.composer-big textarea{width:100%;border:0;background:transparent;resize:none;min-height:110px;padding:16px 18px 6px;outline:none;font-size:16px;line-height:1.5}
.composer-row{display:flex;align-items:center;gap:6px;padding:8px 10px 10px;flex-wrap:wrap}
.composer-row .grow{flex:1}
.attach-thumb{display:inline-flex;align-items:center;gap:6px;background:var(--sunk);border-radius:6px;padding:3px 8px;font-size:12.5px}
.swatch{width:12px;height:12px;border-radius:3px;display:inline-block;border:1px solid var(--line-strong)}
.examples{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.remix{max-width:1120px;width:100%;margin:44px auto 120px;display:grid;gap:12px}
.remix-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.remix-card{padding:0;text-align:left;overflow:hidden;display:grid}
.remix-card .thumb{height:104px;background:var(--sunk);border-bottom:1px solid var(--line);position:relative;overflow:hidden}
.remix-card .meta{padding:10px 12px;display:grid;gap:2px}
.remix-card .meta b{font-weight:600}
.thumb .bar{position:absolute;left:12px;right:12px;height:8px;border-radius:3px;background:var(--line-strong)}
.continue{max-width:1120px;width:100%;margin:28px auto 0;display:grid;gap:10px}
.continue-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.continue-row .card{padding:12px 14px;display:grid;gap:4px;text-align:left}

/* Clarify + Plan cards (shared by home + workspace) */
.flow-card{padding:18px;display:grid;gap:14px}
.flow-card h2{font-size:18px;font-weight:650}
.q{display:grid;gap:8px}
.q .qt{font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.found{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13.5px;background:var(--sunk);border-radius:8px;padding:8px 10px}
.row-end{display:flex;gap:8px;justify-content:flex-end;align-items:center;flex-wrap:wrap}
.coverage{display:grid;gap:2px;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.cov{display:grid;grid-template-columns:22px 1fr auto auto;gap:8px;align-items:center;padding:8px 12px;background:var(--surface)}
.cov+.cov{border-top:1px solid var(--line)}
.cov .ic{font-weight:700}
.cov.later{color:var(--muted)}
.assume{display:flex;flex-wrap:wrap;gap:6px}
.sections{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.sec{border:1px solid var(--line);border-radius:8px;padding:10px 12px;text-align:left;background:var(--surface)}
.sec b{display:block;font-size:13px}
.sec span{font-size:12.5px;color:var(--muted)}
.estimate{display:flex;align-items:center;gap:10px;flex-wrap:wrap;border:1px dashed var(--cost);border-radius:8px;padding:10px 12px;background:var(--cost-soft);color:var(--text)}
.estimate b{color:var(--cost)}

/* ── WORKSPACE ─────────────────────────────── */
.ws{height:100%;display:grid;grid-template-rows:auto 1fr;min-height:0}
.topbar{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line);background:var(--surface);flex-wrap:wrap;position:relative;z-index:5}
.topbar .grow{flex:1}
.proj{display:inline-flex;align-items:center;gap:6px;font-weight:650;border:0;background:none;padding:4px 6px;border-radius:6px}
.proj:hover{background:var(--sunk)}
.budget{display:inline-flex;align-items:center;gap:8px;font-size:13px;padding:4px 8px;border-radius:6px;border:1px solid var(--line);background:var(--surface)}
.meter{width:72px;height:6px;border-radius:999px;background:var(--sunk);overflow:hidden;display:inline-block}
.meter i{display:block;height:100%;background:var(--cost);border-radius:inherit}
.body{display:grid;grid-template-columns:minmax(330px,400px) 1fr;min-height:0}
.leftnav{display:none}
.chat{display:grid;grid-template-rows:1fr auto;min-height:0;border-right:1px solid var(--line);background:var(--bg)}
.msgs{overflow:auto;padding:16px 14px;display:flex;flex-direction:column;gap:12px;min-height:0}
.msgs>*{flex-shrink:0}
.msg-user{align-self:flex-end;max-width:88%;background:var(--sunk);border-radius:10px 10px 2px 10px;padding:8px 12px;font-size:14px}
.msg-arch{font-size:14px;display:grid;gap:6px}
.msg-arch .who{font-size:12px;color:var(--muted);font-weight:600;display:flex;gap:6px;align-items:center}
.run{border:1px solid var(--line);border-radius:8px;background:var(--surface);overflow:hidden}
.run-h{display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid var(--line);font-size:13.5px}
.run-h{flex-wrap:wrap}
.run-h b{font-weight:650;white-space:nowrap}
.run.compact .run-h{border-bottom:0}
.run-h .grow{flex:1}
.run-b{padding:10px;display:grid;gap:8px;font-size:13.5px}
.ms{display:grid;gap:4px}
.ms div{display:flex;align-items:center;gap:8px}
.ms .st{width:16px;text-align:center;font-weight:700}
.ms .done{color:var(--ok)} .ms .now{color:var(--accent)} .ms .todo{color:var(--faint)}
.spin{display:inline-block;width:12px;height:12px;border:2px solid var(--accent-soft);border-top-color:var(--accent);border-radius:50%;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
.ev{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;align-items:start}
.ev .k{font-size:12px;color:var(--muted);font-weight:600;padding-top:2px}
.ev .v{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.shot{width:64px;height:40px;border-radius:4px;border:1px solid var(--line-strong);background:var(--app-bg);position:relative;overflow:hidden;flex:none}
.shot::before{content:"";position:absolute;left:0;top:0;bottom:0;width:14px;background:var(--app-chip)}
.shot::after{content:"";position:absolute;left:18px;right:6px;top:8px;height:5px;border-radius:2px;background:var(--app-ink);opacity:.6;box-shadow:0 9px 0 var(--app-chip),0 18px 0 var(--app-chip)}
.heads{border-left:3px solid var(--cost);background:var(--cost-soft);padding:6px 10px;border-radius:0 6px 6px 0;font-size:13px}
.run-f{display:flex;gap:6px;flex-wrap:wrap;padding:0 10px 10px}
.receipt{font-family:var(--mono);font-size:12px;color:var(--muted);display:grid;gap:2px;border-top:1px dashed var(--line);padding-top:8px}
.receipt div{display:flex;justify-content:space-between;gap:10px}
.notcharged{color:var(--ok)}
.loop{border-color:var(--cost)}
.loop .run-h{background:var(--cost-soft)}
.suggest{display:flex;gap:6px;flex-wrap:wrap}
.suggest .chip{font-size:12.5px}
.composer{border-top:1px solid var(--line);padding:10px;background:var(--surface);display:grid;gap:8px}
.queued{font-size:13px;color:var(--muted);display:flex;gap:8px;align-items:center;background:var(--sunk);padding:5px 8px;border-radius:6px}
.composer textarea{width:100%;border:1px solid var(--line-strong);border-radius:8px;padding:8px 10px;resize:none;min-height:58px;background:var(--bg);outline:none}
.composer textarea:focus{border-color:var(--accent)}
.comp-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.comp-row .grow{flex:1}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:6px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:4px 10px;font-size:13px;font-weight:500}
.seg button+button{border-left:1px solid var(--line-strong)}
.seg button.on{background:var(--text);color:var(--bg)}
.est{font-size:12.5px}

.right{display:grid;grid-template-rows:auto 1fr auto;min-height:0;min-width:0;background:var(--bg)}
.tabs{display:flex;align-items:center;gap:2px;padding:6px 8px;border-bottom:1px solid var(--line);background:var(--surface);overflow-x:auto}
.tabs .tab{border:0;background:none;padding:6px 12px;border-radius:6px;font-weight:500;font-size:14px;position:relative;white-space:nowrap;color:var(--muted)}
.tabs .tab.on{color:var(--text);background:var(--sunk)}
.tabs .tab .new{position:absolute;top:5px;right:4px;width:6px;height:6px;border-radius:50%;background:var(--accent)}
.tabs .grow{flex:1}
.pane{min-height:0;overflow:auto;position:relative}
.docks{border-top:1px solid var(--line);background:var(--surface)}
.dock-tabs{display:flex;gap:2px;padding:4px 8px;align-items:center;overflow-x:auto}
.dock-tabs button{border:0;background:none;padding:3px 9px;border-radius:5px;font-size:12.5px;color:var(--muted);font-family:var(--mono)}
.dock-tabs button.on{background:var(--sunk);color:var(--text)}
.dock-body{height:170px;overflow:auto;border-top:1px solid var(--line);padding:8px 12px;font-family:var(--mono);font-size:12.5px;background:var(--sunk)}
.dock-body .ln{white-space:pre-wrap}

/* preview frame + user's app */
.pv-wrap{padding:14px;display:grid;gap:8px;min-height:100%;align-content:start}
.pv-tool{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.pv-tool .grow{flex:1}
.pv-url{font-family:var(--mono);font-size:12px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:3px 8px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.frame{border:1px solid var(--line-strong);border-radius:10px;overflow:hidden;background:var(--app-bg);box-shadow:var(--shadow);position:relative;min-height:420px}
.frame.select *[data-sel]{outline:1px dashed transparent;cursor:pointer}
.frame.select *[data-sel]:hover{outline-color:var(--accent);outline-offset:2px}
.frame .sel{outline:2px solid var(--accent)!important;outline-offset:2px}
.demo{position:absolute;top:10px;right:10px;z-index:2;font:600 12px var(--mono);letter-spacing:.04em;text-transform:uppercase;background:var(--cost);color:var(--surface);padding:3px 7px;border-radius:4px}
.waking{position:absolute;inset:0;display:grid;place-items:center;background:color-mix(in srgb,var(--app-bg) 70%,transparent);backdrop-filter:blur(2px);z-index:3;font-size:14px}
.app{display:grid;grid-template-columns:150px 1fr;min-height:420px;color:var(--app-ink);font-family:var(--ui)}
.app-side{background:var(--app-chip);padding:14px 10px;display:grid;align-content:start;gap:4px;font-size:13px}
.app-side .brand{font-family:var(--display);font-weight:650;font-size:17px;margin-bottom:8px}
.app-side a{padding:5px 8px;border-radius:6px;color:var(--app-ink);text-decoration:none}
.app-side a.on{background:var(--app-card)}
.app-main{padding:16px;display:grid;gap:12px;align-content:start;min-width:0}
.app-main h3{font-family:var(--display);font-weight:650;font-size:24px;letter-spacing:-.01em}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stats.airy{gap:16px}
.stat{background:var(--app-card);border-radius:8px;padding:10px 12px;display:grid}
.stats.airy .stat{padding:16px}
.stat span{font-size:12px;color:var(--app-muted)}
.stat b{font-family:var(--display);font-size:22px}
.tickets{background:var(--app-card);border-radius:8px;overflow:hidden;font-size:13px}
.tk{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:9px 12px;border-top:1px solid var(--app-chip)}
.tk:first-child{border-top:0}
.tk .s{color:var(--app-muted);font-size:12px;grid-column:1/-1}
.tag{font-size:12px;font-weight:600;border-radius:999px;padding:1px 7px;background:var(--app-chip)}
.tag.u{background:#F3D9D3;color:#7A2A1B}
.draft{background:var(--app-card);border-radius:8px;padding:12px;font-size:13px;display:grid;gap:8px;border:1px dashed var(--app-muted)}
.draft .h{font-size:12px;color:var(--app-muted)}
.app-btn{background:var(--app-accent);color:var(--app-bg);border:0;border-radius:6px;padding:5px 10px;font-size:12.5px;font-weight:600;justify-self:start}
.skel{background:var(--app-chip);border-radius:6px;opacity:.7}
.empty-inbox{padding:22px;text-align:center;color:var(--app-muted);font-size:13px}
.floatbar{position:absolute;z-index:4;display:flex;gap:2px;padding:4px;background:var(--surface);border:1px solid var(--line-strong);border-radius:8px;box-shadow:var(--shadow);font-size:13px;color:var(--text)}
.floatbar button{border:0;background:none;padding:4px 8px;border-radius:5px}
.floatbar button:hover{background:var(--sunk)}
.tray{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--accent);border-radius:8px;background:var(--accent-soft);font-size:13.5px;flex-wrap:wrap}

/* generic tab bodies */
.tb{padding:16px;display:grid;gap:14px;align-content:start}
.split{display:grid;grid-template-columns:220px 1fr;gap:14px;min-height:0}
.list{display:grid;gap:4px;align-content:start}
.list button{display:flex;gap:8px;align-items:center;border:1px solid transparent;background:none;border-radius:6px;padding:7px 9px;text-align:left}
.list button.on{background:var(--surface);border-color:var(--line)}
.subtabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto}
.subtabs button{border:0;background:none;padding:7px 11px;font-size:13.5px;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.subtabs button.on{color:var(--text);border-bottom-color:var(--accent)}
table.t{width:100%;border-collapse:collapse;font-size:13px}
.t th{text-align:left;font-weight:600;color:var(--muted);font-size:12px;padding:6px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.t td{padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.graph{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px}
.graph svg{width:100%;height:auto;display:block}
.steps{display:grid;gap:0;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.step{border-top:1px solid var(--line)}
.step:first-child{border-top:0}
.step>button{display:grid;grid-template-columns:22px 1fr auto auto;gap:8px;width:100%;text-align:left;border:0;background:none;padding:8px 10px;align-items:center}
.step-d{padding:4px 12px 12px 40px;display:grid;gap:8px;font-size:13px}
.io{font-family:var(--mono);font-size:12px;background:var(--sunk);border-radius:6px;padding:8px 10px;white-space:pre-wrap}
.check{display:grid;grid-template-columns:22px 1fr auto;gap:8px;align-items:start;padding:9px 12px;border-top:1px solid var(--line)}
.check:first-child{border-top:0}
.checks{border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.kv{display:grid;grid-template-columns:140px 1fr;gap:8px 14px;align-items:center;font-size:14px}
.code{font-family:var(--mono);font-size:12.5px;line-height:1.6;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 0;overflow:auto;white-space:pre;tab-size:2;outline:none}
.code .l{display:block;padding:0 12px}
.code .add{background:var(--ok-soft)}
.code .del{background:var(--risk-soft)}
.code .n{color:var(--faint);display:inline-block;width:28px;user-select:none}
.intent{border:1px solid var(--line);border-radius:8px;background:var(--surface);overflow:hidden}
.intent-h{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line);font-size:13.5px;flex-wrap:wrap}
.assump{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:8px 12px;background:var(--needs-soft);font-size:13px}

/* drawer + modal */
.scrim{position:fixed;inset:0;background:rgba(10,12,16,.35);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(420px,100vw);background:var(--surface);border-left:1px solid var(--line);z-index:41;display:grid;grid-template-rows:auto 1fr;padding-top:env(safe-area-inset-top,0px)}
.drawer-h{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line)}
.drawer-h .grow{flex:1}
.tl{overflow:auto;padding:12px 14px;display:grid;gap:0;align-content:start;grid-auto-rows:max-content}
.cp{display:grid;grid-template-columns:18px 1fr;gap:10px;padding-bottom:14px;position:relative}
.cp::before{content:"";position:absolute;left:8px;top:16px;bottom:0;width:2px;background:var(--line)}
.cp:last-child::before{display:none}
.cp .d{width:18px;height:18px;border-radius:50%;border:2px solid var(--accent);background:var(--surface);margin-top:2px}
.cp .c{display:grid;gap:4px;font-size:13.5px}
.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(520px,calc(100vw - 32px));max-height:calc(100vh - 48px);overflow:auto;z-index:42;padding:18px;display:grid;gap:14px;box-shadow:var(--shadow)}
.modal h2{font-size:18px}
.blast{display:grid;gap:0;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.blast div{display:grid;grid-template-columns:1fr auto;gap:10px;padding:8px 12px;border-top:1px solid var(--line);font-size:14px}
.blast div:first-child{border-top:0}
.authbtns{display:grid;gap:8px}
.cm-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.cm-opt{display:grid;gap:2px;text-align:left;padding:10px 12px;border:1px solid var(--line-strong);border-radius:8px;background:var(--surface);color:var(--text);min-height:44px}
.cm-opt b{font-size:14px;display:flex;gap:6px;align-items:center}
.cm-opt span{font-size:12.5px;color:var(--muted)}
.cm-opt.on{border-color:var(--accent);background:var(--accent-soft)}
.cm-note{display:flex;gap:8px;align-items:flex-start;font-size:12.5px;color:var(--muted);background:var(--sunk);border-radius:6px;padding:8px 10px}
.cm-err{font-size:13px;color:var(--risk);background:var(--risk-soft);border-radius:6px;padding:8px 10px}
.modal .field{display:grid;gap:6px}
.modal .field>span{font-size:13px;font-weight:600}
.modal .field input,.modal .field select{min-height:40px}
@media (max-width:420px){.cm-grid{grid-template-columns:1fr}}
.authbtns .btn{justify-content:center;padding:9px}
.stepper{display:flex;gap:6px;flex-wrap:wrap}
.stepper span{font-size:12.5px;padding:2px 8px;border-radius:999px;background:var(--sunk);color:var(--muted)}
.stepper span.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.stepper span.done{color:var(--ok)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:70;background:var(--text);color:var(--bg);padding:9px 14px;border-radius:8px;font-size:14px;box-shadow:var(--shadow);max-width:calc(100vw - 32px)}

/* workspace-level pages */
.page{max-width:1080px;margin:0 auto;padding-block:20px 120px;display:grid;gap:16px;width:100%}
.page-wrap{padding-inline:16px;overflow:auto;height:100%}
.page h1{font-size:24px;font-weight:650;letter-spacing:-.01em}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.runrow{display:grid;grid-template-columns:auto 1fr auto auto;gap:12px;align-items:center;padding:12px 14px;border-top:1px solid var(--line)}
.runrow:first-child{border-top:0}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.tile{padding:14px;display:grid;gap:4px}
.tile b{font-size:22px;font-family:var(--mono);font-weight:500}
.bars{display:grid;gap:8px}
.bar-row{display:grid;grid-template-columns:140px 1fr 70px;gap:10px;align-items:center;font-size:13.5px}
.bar-row .track{height:8px;background:var(--sunk);border-radius:999px;overflow:hidden}
.bar-row .track i{display:block;height:100%;border-radius:inherit}

/* user-app variants driven by builds/visual edits */
.frame.appdark{--app-bg:#18201C;--app-ink:#E4EEE8;--app-card:#212B26;--app-muted:#A3B3AA;--app-accent:#8FD1AE;--app-chip:#2B3731}
.frame.alt{--app-accent:#9A3412}
.tk .w{font-family:var(--mono);font-size:12px;color:var(--app-muted)}
.grp-h{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--app-muted);padding:8px 12px 2px;font-weight:600}
.delta{border:1px solid var(--accent);border-radius:8px;background:var(--surface);overflow:hidden}
.delta .run-h{background:var(--accent-soft)}

/* blueprint + checks */
.bp{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:14px;align-items:start}
.bp-map{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px;overflow-x:auto}
.bp-map svg{width:100%;min-width:560px;height:auto;display:block}
.agents-split{grid-template-columns:minmax(0,300px) 1fr}
.bp-list{display:none}
@media (max-width:640px){.bp-list{display:grid;gap:6px}.bp-hint{display:inline}}
.bp-hint{display:none}
.bp-map g.node{cursor:pointer}
.bp-map g.node:focus{outline:none}
.bp-map g.node:hover rect,.bp-map g.node:focus rect{stroke:var(--accent);stroke-width:2}
.bp-side{padding:14px;display:grid;gap:10px;font-size:13.5px;align-content:start}
.src{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;padding:9px 12px;border-top:1px solid var(--line);font-size:13.5px}
.src:first-child{border-top:0}
.src .dm{font-family:var(--mono);font-size:12px;color:var(--muted);grid-column:2}
.finding{display:grid;gap:4px;padding:10px 12px;border-top:1px solid var(--line);font-size:13.5px}
.finding:first-child{border-top:0}
.became{font-size:12.5px;color:var(--accent)}
.adr{padding:12px;display:grid;gap:6px;font-size:13.5px}
.checkpill{display:inline-flex;align-items:center;gap:6px;font-size:13px;border:1px solid var(--line);border-radius:6px;padding:4px 8px;background:var(--surface)}
.suite{border:1px solid var(--line);border-radius:8px;overflow:hidden}
.suite-h{display:flex;gap:8px;align-items:center;padding:9px 12px;background:var(--sunk);font-size:13.5px;flex-wrap:wrap}
.researching{display:grid;gap:8px}
@media (max-width:1100px){.bp{grid-template-columns:1fr}}

/* mobile switcher */
.mswitch{display:none}
@media (max-width:959px){
  .body{grid-template-columns:1fr}
  .chat{border-right:0}
  .body.show-preview .chat{display:none}
  .body:not(.show-preview) .right{display:none}
  .mswitch{display:inline-flex}
  .split{grid-template-columns:1fr}
  .hide-sm{display:none!important}
  .app{grid-template-columns:1fr}
  .app-side{display:none}
  .stats{grid-template-columns:1fr 1fr}
  .kv{grid-template-columns:1fr}
  .bar-row{grid-template-columns:100px 1fr 56px}
}
@media (max-width:959px){.agents-split{grid-template-columns:1fr}}
@media (max-width:640px){
  .check{grid-template-columns:22px 1fr}
  .check>:nth-child(3){grid-column:2;justify-self:start}
  .proto .tag,.proto [data-a=reset]{display:none}
  .proto{bottom:calc(10px + env(safe-area-inset-bottom,0px));right:10px}
}
@media (max-width:480px){
  .runrow{grid-template-columns:auto 1fr}
  .runrow .hide-xs{display:none}
  .stats{grid-template-columns:1fr}
}

/* ── harness + workbench ── */
.ic{flex:none;vertical-align:-2px}
.chat{display:flex;flex-direction:column}
.chat>.msgs{flex:1 1 0;min-height:0}
.chat-h{display:flex;align-items:center;gap:6px;padding:6px 10px;border-bottom:1px solid var(--line);background:var(--surface);position:relative;flex-wrap:wrap}
.chat-h .grow{flex:1}
.chat-h .pill{border:0;cursor:pointer}
.pop{display:grid;gap:2px;padding:6px;background:var(--surface);border:1px solid var(--line-strong);border-radius:10px;box-shadow:var(--shadow);max-height:min(60vh,460px);overflow:auto;z-index:30}
.composer{position:relative}
.composer>.pop{position:absolute;left:10px;right:10px;bottom:calc(100% - 4px);max-height:min(56vh,440px)}
.pop.float{position:absolute;top:calc(100% + 4px);left:8px;width:min(340px,calc(100vw - 32px))}
.pop-sep{height:1px;background:var(--line);margin:4px 2px}
.pop-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:4px 8px}
.pop .label{padding:6px 8px 2px}
.opt{display:flex;gap:10px;align-items:center;justify-content:space-between;text-align:left;border:0;background:none;padding:7px 9px;border-radius:7px;width:100%;font-size:13.5px;min-height:36px;color:var(--text)}
.opt:hover{background:var(--sunk)}
.opt-1{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.opt.on{background:var(--accent-soft);box-shadow:inset 2px 0 0 var(--accent)}
.inp{border:1px solid var(--line-strong);border-radius:6px;padding:6px 8px;background:var(--bg);width:100%}
.btn.on{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.tog{display:flex;gap:8px;align-items:flex-start;font-size:13.5px;padding:4px 2px;cursor:pointer}
.tog input{margin-top:3px;accent-color:var(--accent)}
.hsec{display:grid;gap:6px;padding-block:10px;border-top:1px solid var(--line)}
.hsec:first-of-type{border-top:0}
.wb{display:grid;min-height:0;height:100%}
.actbar{display:flex;flex-direction:column;gap:4px;padding:8px 4px;border-right:1px solid var(--line);background:var(--surface)}
.actbar button{position:relative;display:grid;justify-items:center;gap:3px;border:0;background:none;border-radius:8px;padding:8px 2px;font-size:12px;font-weight:600;color:var(--muted)}
.actbar button:hover{background:var(--sunk);color:var(--text)}
.actbar button.on{color:var(--accent);background:var(--accent-soft)}
.badge{position:absolute;top:2px;right:4px;min-width:16px;height:16px;border-radius:8px;background:var(--needs);color:var(--bg);font-size:12px;display:grid;place-items:center;padding:0 4px}
.wb-side{border-right:1px solid var(--line);background:var(--bg);overflow:auto;padding:10px;display:grid;gap:8px;align-content:start;min-width:0}
.side-h{display:flex;align-items:center;gap:6px}
.side-h .grow{flex:1}
.side-p{font-size:12.5px;margin:0}
.thread{display:grid;gap:2px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;width:100%;min-width:0}
.thread:hover{border-color:var(--line-strong)}
.thread.on{border-color:var(--accent)}
.thread-t{display:flex;gap:6px;align-items:center;justify-content:space-between}
.tree{display:grid;gap:1px}
.tree button{text-align:left;border:0;background:none;border-radius:5px;padding:4px 6px;display:flex;gap:6px;align-items:center;font-family:var(--mono);font-size:12.5px;color:var(--text)}
.tree button:hover{background:var(--sunk)}
.tree button.on{background:var(--accent-soft);color:var(--accent)}
.tree-d{font-family:var(--mono);font-size:12px;color:var(--muted);padding:6px 6px 2px}
.wb-main{display:grid;min-height:0;min-width:0;border-right:1px solid var(--line)}
.grp{display:grid;grid-template-rows:auto 1fr;min-height:0;min-width:0;border-right:1px solid var(--line);position:relative}
.grp:last-child{border-right:0}
.gtabs{display:flex;align-items:center;gap:2px;padding:4px 6px;border-bottom:1px solid var(--line);background:var(--surface);overflow-x:auto;min-height:40px}
.gtabs .grow,.btabs .grow{flex:1}
.gtab{display:inline-flex;align-items:center;border-radius:6px;white-space:nowrap}
.gtab>button{border:0;background:none;padding:5px 8px;font-size:13px;display:inline-flex;gap:6px;align-items:center;color:var(--muted)}
.gtab.on{background:var(--sunk)}
.gtab.on>button{color:var(--text)}
.gtab .x{padding:4px 6px;opacity:.55}
.gtab .x:hover{opacity:1}
.grp.act .gtab.on{box-shadow:inset 0 -2px 0 var(--accent)}
.gbody{min-height:0;display:grid;overflow:hidden}
.gbody>.scroll{overflow:auto;min-height:0}
.gbody>.chat{border-right:0}
.dot-n,.dot-o{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--needs)}
.dot-o{background:var(--ok)}
.btabs{display:flex;align-items:center;gap:2px;overflow-x:auto;padding-bottom:2px;min-height:34px}
.btabs .gtab>button{font-family:var(--mono);font-size:12.5px}
.cmp{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.cmp-c{display:grid;gap:6px;align-content:start;min-width:0}
.tilebtn{border:0;background:none;padding:0;text-align:left;color:var(--text)}
.tilebtn:hover .mini{border-color:var(--accent)}
.mini{height:230px;overflow:hidden;border:1px solid var(--line-strong);border-radius:8px;background:var(--app-bg);position:relative}
.mini .scale{transform:scale(.5);transform-origin:0 0;width:200%;pointer-events:none}
.mini.phone{max-width:210px;width:100%;justify-self:center}
.mini.phone .app,.phoneframe .app{grid-template-columns:1fr}
.mini.phone .app-side,.phoneframe .app-side{display:none}
.frame.phoneframe{max-width:390px;margin-inline:auto;width:100%}
.phoneframe .stats{grid-template-columns:1fr 1fr}
.pal{top:12vh;transform:translateX(-50%);gap:6px;width:min(560px,calc(100vw - 32px))}
.pal input{width:100%;border:1px solid var(--line-strong);border-radius:8px;padding:10px 12px;font-size:16px;background:var(--bg);outline:none}
.pal input:focus{border-color:var(--accent)}
.pal #pal-list{display:grid;gap:1px;max-height:52vh;overflow:auto}
.pal-g{padding:8px 9px 2px}
@media (max-width:959px){.chat-h .btn .ic+*{display:inline}}

/* ══ v5 · design system pass (ui-ux-pro-max: Developer Tool profile → Minimalism & Swiss + Flat) ══
   Tokens: 4/8 spacing, two radii, a z-index scale, motion tokens. One accent (teal); colour only encodes state. */
:root{--sp-1:4px;--sp-2:8px;--sp-3:12px;--sp-4:16px;--sp-5:24px;--sp-6:32px;--r-1:6px;--r-2:10px;
  --z-bar:10;--z-pop:30;--z-proto:39;--z-overlay:40;--z-menu:61;--z-toast:70;
  --dur-out:120ms;--dur-in:180ms;--ease-out:cubic-bezier(.2,.8,.2,1);--proto-h:32px}
body{font-size:15px;letter-spacing:0}
#root{height:calc(100% - var(--proto-h));margin-top:var(--proto-h)}
.btn,.chip,.tab,.seg button,.opt,.bnav button,.viewsw span{transition:background-color var(--dur-out) ease,border-color var(--dur-out) ease,color var(--dur-out) ease}
.btn:active,.chip:active{transform:scale(.98)}
.btn.accent{border-color:var(--accent);color:var(--accent);background:var(--surface)}
.btn.accent:hover{background:var(--accent-soft)}
.kbd{font-size:12px}
.skip{position:absolute;left:8px;top:-48px;z-index:100;background:var(--text);color:var(--bg);padding:8px 12px;border-radius:var(--r-1)}
.skip:focus{top:calc(var(--proto-h) + 8px)}

/* prototype strip: honest, always available, never on top of the product */
.proto{position:fixed;left:0;right:0;top:0;bottom:auto;height:var(--proto-h);padding:0 12px;display:flex;gap:8px;align-items:center;justify-content:flex-end;flex-wrap:nowrap;background:var(--sunk);border-bottom:1px solid var(--line);z-index:var(--z-proto);font-size:12.5px}
.proto .tag{margin-right:auto}
.proto-note{color:var(--muted);margin-right:auto;margin-left:-4px}
.proto .tag+.proto-note{margin-left:0}
.proto .tag:has(+.proto-note){margin-right:4px}
.proto .btn{padding:2px 9px;font-size:12.5px}
.proto-menu{top:calc(var(--proto-h) + 6px);bottom:auto;z-index:var(--z-menu)}

/* top bar: one row */
.topbar{flex-wrap:nowrap;gap:6px;min-height:52px;padding:6px 12px}
.projwrap{position:relative;min-width:0}
.proj{display:grid;grid-template-columns:auto auto;grid-template-rows:auto auto;column-gap:6px;align-items:center;text-align:left;padding:3px 8px;min-width:0}
.proj .proj-t{grid-row:1;grid-column:1;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:220px}
.proj .proj-s{grid-row:2;grid-column:1;font-size:12px;font-weight:400;color:var(--muted);display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.proj .proj-s .dot{width:6px;height:6px}
.proj>.ic{grid-row:1/3;grid-column:2;color:var(--muted)}
.projmenu{position:absolute;top:calc(100% + 6px);left:0;width:290px;z-index:var(--z-pop)}
.pm-h{display:grid;gap:2px;padding:6px 8px 8px;border-bottom:1px solid var(--line);margin-bottom:4px;font-size:13px}
.projmenu .opt>span:first-child,.sheet .opt>span:first-child{display:inline-flex;align-items:center;gap:8px}
.searchbox{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line-strong);background:var(--bg);color:var(--muted);border-radius:var(--r-1);padding:5px 8px 5px 10px;font-size:13.5px;min-width:0}
.searchbox:hover{border-color:var(--muted);color:var(--text)}
.searchbox .kbd{margin-left:16px}
.viewsw{display:inline-flex;padding:2px;border:1px solid var(--line-strong);border-radius:var(--r-1);background:var(--bg);gap:2px}
.viewsw span{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:4px;font-size:13px;font-weight:500;color:var(--muted)}
.viewsw span.on{background:var(--surface);color:var(--text);box-shadow:0 0 0 1px var(--line-strong)}
.budget{border:0;background:none;padding:4px 6px}
.checkpill{white-space:nowrap}

/* project views: labelled tabs with icons, underline marks the active one */
.tabs{gap:0;padding:0 8px}
.tabs .tab{display:inline-flex;align-items:center;gap:6px;padding:12px 12px 11px;border-radius:0;border-bottom:2px solid transparent}
.tabs .tab.on{background:none;border-bottom-color:var(--accent);color:var(--text)}
.tabs .tab:hover{color:var(--text)}
.tabs .tab .new{top:9px;right:5px}

/* preview: one browser bar + a floating edit pill */
.btabs{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-2);padding:4px}
.pv-edit{position:sticky;bottom:12px;z-index:4;justify-self:center;display:flex;align-items:center;gap:4px;padding:4px 6px 4px 4px;border:1px solid var(--line-strong);border-radius:999px;background:var(--surface);box-shadow:var(--shadow);max-width:100%;flex-wrap:wrap}
.pv-edit .btn{border-radius:999px}
.pv-edit-hint{font-size:12.5px;color:var(--muted);padding:0 6px}

function inferOutcome(t) {
  const s = (t || "").toLowerCase().trim();
  if (t === DEFAULT_PROMPT) return ["app", "you want a dashboard your team reviews, so I'd build an app with the triage agent inside it. Just the agent, without a screen, would be lighter."];
  if (/\b(app|dashboard|portal|website|site|screens?|booking|tracker|crm|game)\b/.test(s)) return ["app", "people will open it and use screens, so I'd build an app."];
  if (/\b(every|each)\s+(day|morning|evening|week|weekday|monday|tuesday|wednesday|thursday|friday|month|hour)|\bdaily\b|\bweekly\b|\bwhenever\b|\bwhen (a |an )?new\b/.test(s)) return ["automation", "it repeats on a schedule, so it can run on its own. No app needed."];
  if (/\b(own|handle|manage|look after|on call|reachable|teammate|monitor|watch)\b|\b(agent|assistant|bot)\b/.test(s)) return ["agent", "it's an ongoing job that people will hand work to, so I'd make an agent. No app needed."];
  if (/\?\s*$|^(which|what|who|how|when|where|why|is|are|did|do|does|show me|find|list)\b/.test(s)) return ["answer", "it's a question, so I'll answer it from your connected tools. Free."];
  if (/\b(draft|write|create|make|prepare|compile|analy[sz]e|turn|clean|summari[sz]e|compare|update|reply|send)\b/.test(s)) return ["task", "it's a one-off piece of work, so I'll do it now and hand you the result to review."];
  return ["app", "I'd build an app. Tell me if something lighter fits."];
}

/* flows for the lighter outcomes */
async function answerFlow() {
  S.stage = "researching"; S.planStep = 0; S.planStopped = false;
  const r = { type: "research", state: "running", oc: "answer" }; S.msgs.push(r); render();
  for (let k = 1; k < OC_STEPS.answer.length; k++) { await sleep(T(520)); if (S.planStopped) { S.planStopped = false; r.state = "stopped"; S.stage = "answered"; return render(); } S.planStep = k; render(); }
  await sleep(T(400)); r.state = "done"; S.msgs.push({ type: "answermsg" }); S.stage = "answered"; render();
}
function promoteTo(oc) {
  const from = S.oc || "app";
  const say = { task: "Draft replies to these 4 customers", automation: from === "answer" ? "Check this every Monday at 9 and post it in #support" : "Do this every weekday at 9:00", agent: "Make it an agent the team can ask in #support", app: "Add a dashboard where the team reviews and approves drafts" }[oc];
  S.msgs.push({ type: "user", text: say }, { type: "carry", from, to: oc });
  Object.assign(S, { oc, ocWhy: "you asked to take it a step further.", ocChosen: false, stage: "asked", planNotes: [], reply: "", taskSent: false, tryRan: false, pop: null, title: OC_SAMPLE_TITLE[oc] });
  if (oc === "app") S.draft = DEFAULT_PROMPT;
  return proposePlan("");
}
function autoOn(silent) {
  S.autoOn = true; S.stage = "live"; S.overlay = null;
  S.msgs.push({ type: "arch", html: `It's on. <b>Morning support digest</b> runs ${TRIG_TXT[S.trig]}; the next run is tomorrow. Runs show up in <button class="linkbtn" data-a="go" data-s="automations">Automations</button>, and anything that needs you lands in your Inbox.` });
  S.tab = "runs"; render(); if (!silent) toast("Automation on · next run tomorrow at 9:00");
}
function agentLive(silent) {
  S.agentLiveOn = true; S.stage = "live"; S.overlay = null;
  S.msgs.push({ type: "arch", html: `<b>Support Triage</b> is live in #support and on support@acme.com. It works as itself, with its own Slack and Gmail accounts, drafts freely and asks before anything is sent. <b>2 things already need you</b> in <button class="linkbtn" data-a="tab" data-v="activity">Activity</button>.` });
  S.tab = "activity"; render(); if (!silent) toast("Support Triage is live in #support");
}
function jumpOc(oc, opts = {}) {
  const ex = OC_EX.find(x => x[0] === oc), why = inferOutcome(ex[1])[1];
  Object.assign(S, { draft: ex[1], outcome: "auto", screen: "workspace", homeStep: "compose", build: "none", phase: 0, panelOff: false, showPreviewMobile: false, planNotes: [], reply: "", pop: null, overlay: null, proto: false, planV: 2, mode: "build", taskSent: false, tryRan: false, actDone: [], oc, ocWhy: why, ocChosen: false, title: ocTitle(ex[1]), planStep: 0, sideDrawer: false, layout: "simple" });
  S.msgs = [{ type: "user", text: ex[1] }].concat(oc === "answer" ? [] : [{ type: "ask", oc, why }]).concat([{ type: "research", state: "done", oc }, { type: OC_RESULT[oc] }]);
  S.stage = oc === "answer" ? "answered" : "planned"; S.tab = OC_FIRST[oc] || null;
  if (oc === "agent") S.agentLiveOn = false; if (oc === "automation") S.autoOn = false;
  if (opts.live) { S.signedIn = true; if (oc === "agent") return agentLive(true); if (oc === "automation") return autoOn(true); }
  render();
}

  if (t === "kits") body = `<p class="muted" style="margin:0">A kit is one install that bundles connections, skills, agents and rules. It's the plugin format Claude and ChatGPT use too.</p><div class="ways-grid">${KITS.map(([n, by, d, inside]) => `<div class="card way"><b>${n}</b><span class="faint" style="font-size:12.5px">by ${by}</span><span class="muted">${d}</span><span class="mono faint" style="font-size:12.5px">${inside}</span>${S.kitsOn[n] ? pill("ok", "Installed") : `<button class="btn small" data-a="kit-install" data-v="${esc(n)}" style="justify-self:start">Install</button>`}</div>`).join("")}</div>
    <div class="card" style="padding:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap"><span style="flex:1;min-width:220px"><b>Make your own kit</b><span class="muted" style="display:block;font-size:13.5px">Describe the job. Daedalus bundles the connections, skills, agents and rules into one install your team can add.</span></span><button class="btn" data-a="kit-create">Create a kit with Daedalus</button></div>`;
  if (t === "instructions") body = `<p class="muted" style="margin:0">Instructions are what Daedalus and your agents should always keep in mind. They're requests, not guarantees: for anything that must happen every time, use a rule.</p>
    ${[["org", "Organisation", "Set by your admins. Applies to everyone and every agent.", S.instrOrg, true], ["project", "This project · Support Desk", "Only for this project.", S.instrProject, false], ["me", "Me", "How Daedalus works with you.", S.instrMe, false]].filter(([k]) => inScope(k)).map(([k, l, d, val, lock]) => `<div class="card" style="padding:14px;display:grid;gap:8px"><div class="pop-row" style="padding:0"><b>${l}</b>${lock ? pill("live", "Required") : ""}<span class="grow" style="flex:1"></span>${lock ? `<span class="faint" style="font-size:12.5px">Only admins can edit</span>` : `<button class="btn small" data-a="instr-save" data-v="${k}">Save</button>`}</div><span class="muted" style="font-size:13px">${d}</span><label class="sr" for="instr-${k}">${l} instructions</label><textarea id="instr-${k}" class="inp" rows="3" data-in="instr${k === "org" ? "Org" : k === "project" ? "Project" : "Me"}" ${lock ? "readonly" : ""}>${esc(val)}</textarea></div>`).join("")}
    <div class="label">Memory · what Daedalus and your agents learned</div><div class="checks">${MEM.map((m, i) => S.memDel.includes(i) ? "" : `<div class="check"><span>${ic("bulb", 15)}</span><span><b>${m[0]}</b><div class="muted" style="font-size:13px">${m[1]}</div></span><button class="btn small ghost" data-a="mem-del" data-v="${i}">Forget</button></div>`).join("") || `<div class="check"><span></span><span class="muted">Nothing remembered.</span><span></span></div>`}</div>`;
  if (t === "rules") {
    const rows = RULES.concat(S.rulesExtra).filter(r => inScope(r[3]));
    body = `<p class="muted" style="margin:0"><b>Instructions are requests. Rules always run:</b> they fire on an event, every time, whatever the AI decides. Your organisation can require some.</p>
      <div class="checks">${rows.map(([id, when, then, s, req, how]) => `<div class="rule"><label class="tog"><input type="checkbox" data-a="rule-tog" data-v="${id}" ${S.rulesOn[id] ? "checked" : ""} ${req ? "disabled" : ""}><span>When <span class="tok">${when}</span>, then <span class="tok">${then}</span></span></label><span class="rule-m">${scopeP(s)}${req ? " " + pill("live", "Required") : ""}</span><details class="rule-how"><summary>How it runs</summary><code class="mono">${esc(how)}</code></details></div>`).join("")}</div>
      <div class="card" style="padding:14px;display:grid;gap:10px"><b>New rule</b><div class="rulebuild"><span>When</span><label class="sr" for="rule-when">Event</label><select id="rule-when" class="inp" data-in="ruleWhen">${RULE_EVENTS.map(e => `<option ${S.ruleWhen === e ? "selected" : ""}>${e}</option>`).join("")}</select><span>then</span><label class="sr" for="rule-then">Action</label><select id="rule-then" class="inp" data-in="ruleThen">${RULE_ACTIONS.map(e => `<option ${S.ruleThen === e ? "selected" : ""}>${e}</option>`).join("")}</select><button class="btn" data-a="rule-add">Add rule</button></div></div>`;
  }
  if (t === "autonomy") body = `<p class="muted" style="margin:0"><b>Drafting doesn't mean sending.</b> Whatever you choose here, sending email, posting outside your team, spending past a cap, deleting data and deploying always follow your rules.</p>
    ${[["builds", "When Daedalus builds"], ["agents", "Your agents"], ["autos", "Your automations"]].map(([k, l]) => `<div class="card" style="padding:14px;display:grid;gap:10px"><b>${l}</b><div class="levels" role="group" aria-label="${l}">${[["ask", "Ask me", "Every action waits for your OK"], ["auto", "Auto", "Recommended. A reviewer approves routine steps; anything that sends, spends, deletes or deploys comes to you"], ["full", "Full auto", "Runs on its own inside its sandbox and budget. Rules still apply"]].map(([v, n, d]) => `<button class="level ${S.auton[k] === v ? "on" : ""}" data-a="auton" data-v="${k}:${v}" aria-pressed="${S.auton[k] === v}"><b>${n}</b><span class="muted" style="font-size:13px">${d}</span></button>`).join("")}</div></div>`).join("")}`;
  if (t === "advanced") body = `<p class="muted" style="margin:0">Everything on this page is a standard file in your project: <span class="mono">AGENTS.md</span>, <span class="mono">SKILL.md</span>, hooks, MCP settings and a plugin manifest. Claude Code and Codex read the same files, so nothing is locked in.</p>
    <div class="checks">${ADV_FILES.map(([k, p, c]) => `<div class="check"><span>${ic("file", 15)}</span><span><b class="mono">${p}</b><details class="rule-how"><summary>Show</summary><pre class="codeblock">${esc(c || SKILL_MD["email-triage"])}</pre></details></span><span></span></div>`).join("")}</div>
    <div class="label">MCP servers</div><div class="tbl-wrap"><table class="tbl" style="min-width:520px"><thead><tr><th>Server</th><th>Address</th><th class="num">Tools</th><th>Used by</th></tr></thead><tbody>${[["gmail", "mcp.lyzr.ai/gmail", 9, "Support Triage, digest"], ["slack", "mcp.lyzr.ai/slack", 6, "Support Triage, digest"], ["github", "api.githubcopilot.com/mcp", 31, "Daedalus"]].concat(S.conn.Shopify ? [["shopify", "mcp.lyzr.ai/shopify", 7, "Support Triage"]] : []).map(r => `<tr><td class="mono">${r[0]}</td><td class="mono">${r[1]}</td><td class="num mono">${r[2]}</td><td>${r[3]}</td></tr>`).join("")}</tbody></table></div>
    <div class="label">Specialists</div><div class="checks">${SPECIALISTS.map(([n, d, m]) => `<div class="check"><span>${ic("agents", 15)}</span><span><b>${n}</b><div class="muted" style="font-size:13px">${d}</div></span><span class="mono faint" style="font-size:12.5px">${m}</span></div>`).join("")}</div>
    <div class="pm-actions"><button class="btn" data-a="toast" data-t="Exports a kit (plugin) with these connections, skills, agents and rules">Export as a kit</button><button class="btn ghost" data-a="toast" data-t="Opens this project in Claude Code, with the same files">Open in Claude Code</button><button class="btn ghost" data-a="toast" data-t="Opens this project in Codex, with the same files">Open in Codex</button></div>`;
  const scopes = [["all", "All"], ["me", "Me"], ["project", "This project"], ["org", "Organisation"]];
  return pageShell("Customize", `<nav class="tabs ah-tabs" role="tablist" aria-label="Customize">${tabs.map(([v, l]) => `<button role="tab" aria-selected="${t === v}" class="tab ${t === v ? "on" : ""}" data-a="cust-tab" data-v="${v}">${l}</button>`).join("")}</nav>

}

async function spawnAgents(task, n) {
  const ms = S.spawnMix ? ["kimi", "sonnet", "gpt", "dsv4"] : Array(4).fill(S.chatModel);
  const vars = [{ airy: true }, { grouped: true }, { dark: true }, { airy: true, grouped: true }], notes = ["More space, calmer cards", "Urgent emails grouped at the top", "Dark theme", "More space + grouping"];
  const ids = [], tag = Date.now().toString(36).slice(-3);
  for (let i = 0; i < n; i++) { const id = `v${tag}${i}`; ids.push(id);
    S.threads.push({ id, name: `Version ${"ABCD"[i]}`, status: "running", branch: `daedalus/try-${"abcd"[i]}-${tag}`, model: ms[i], variant: vars[i], note: notes[i], cost: "", msgs: [{ who: "you", text: task }, { who: "arch", html: `Working on my own branch and sandbox with ${modelName(ms[i])}.` }] }); }
  S.overlay = null; S.pvCompare = ids; S.pvTile = false; S.tab = "preview"; S.showPreviewMobile = true; if (isWB()) S.side = "agents";
  S.msgs.push({ type: "arch", html: `Started ${n} agents on separate branches for “${esc(task)}”. Compare them in the preview and pick one. ${pill("cost", `~${n * 4}–${n * 8} cr`)}` });
  render();
  for (let i = 0; i < n; i++) { await sleep(T(1100 + i * 600)); const t = threadOf(ids[i]); if (!t || t.status !== "running") continue;
    const cr = 4.2 + i * 1.1; t.status = "ready"; t.cost = cr.toFixed(1) + " cr"; S.spent += cr; t.msgs.push({ who: "arch", html: `Done: ${esc(notes[i])}. Checks 30/30 on my branch.` }); render(); }
  toast(`${n} versions ready. Pick one to merge.`);
}
async function loopGoal() {
  const g = S.loopGoal, maxI = S.loopMax;
  const m = { t0: Date.now(), type: "goal", goal: g === "checks" ? "All checks pass" : g === "perf" ? "Inbox loads in under 0.5s" : (S.loopCustom || "My goal"), iters: [], state: "running", cr: 0, max: maxI, budget: S.loopBudget, sched: S.loopSched };
  S.pop = null; S.msgs = S.msgs.filter(x => x.type !== "suggest"); S.msgs.push(m); S.tab = S.tab; render();
  let seq;
  if (g === "checks") seq = S.agentFixed ? [["Run checks → 30/30 passing", true, 0.4]] : [["Run checks → 29/30 · “never promises refunds” fails", false, 0.4], ["Fix Email Triage (v4): send refund requests to a person", false, 2.6], ["Run checks → 30/30 passing", true, 0.4]];
  else if (g === "perf") seq = [["Measure /inbox → 0.80s (goal: under 0.50s)", false, 0.3], ["Add an index on tickets(status) and cache counts → 0.55s", false, 2.9], ["Show 25 emails per page → 0.41s", true, 3.0]];
  else seq = [["Work towards the goal (try 1)", false, 3.0], ["Check the result → goal met", true, 1.2]];
  for (const [text, ok, cr] of seq) {
    await sleep(T(1000)); if (m.state !== "running") return;
    if (m.iters.length >= maxI) { m.state = "stopped"; m.why = `Reached ${maxI} tries`; return render(); }
    if ((m.cr + cr) * 0.05 > m.budget) { m.state = "stopped"; m.why = `The next try would go over $${m.budget}`; return render(); }
    m.iters.push({ text, ok }); m.cr += cr; S.spent += cr; render();
  }
  if (g === "checks" && !S.agentFixed) { S.agentFixed = true; rerunChecks(); }
  m.state = "met"; if (m.sched !== "off") S.schedules.push(`${m.goal} · weekdays 9:00`);
  S.checkpoints.push({ name: `Loop: ${m.goal}`, who: "Daedalus", when: now(), cost: m.cr.toFixed(1) + " cr" });
  render(); toast(`Goal met after ${m.iters.length} ${m.iters.length > 1 ? "tries" : "try"}`);
}

  const cr = MILESTONES.slice(0, S.phase + 1).reduce((s, x) => s + x.cr, 0);
  return `<div class="run" aria-live="polite"><div class="run-h">${running ? `<span class="spin" aria-hidden="true"></span><b>Building</b>` : `<b style="color:var(--ok)">✓ Built</b>`}<span class="grow"></span><span class="pill cost mono">${cr.toFixed(1)} credits</span>${running ? `<button class="btn ghost small" data-a="stop">Stop</button>` : ""}</div>

function triage(q) {
  const x = q.toLowerCase();
  if (/refund|money back|chargeback/.test(x)) return S.agentFixed
    ? { tag: "urgent · billing", draft: "I'm sorry about this. I've passed your request to our team, who will reply about a refund within one business day.", t1: "0.8s", t2: "1.3s" }
    : { tag: "urgent · billing", draft: "We'll refund you in full within 3 days.", t1: "0.8s", t2: "1.1s" };
  if (/payment|charged|card|invoice|billing/.test(x)) return { tag: "urgent · billing", draft: "Sorry about the trouble with your payment. I've checked your account and you can retry from the link below…", t1: "0.9s", t2: "1.4s" };
  if (/where|tracking|deliver|parcel|package|damaged/.test(x)) return { tag: "normal · shipping", draft: "Sorry your parcel didn't arrive as expected. Could you send your order number or a photo? I'll arrange a replacement or escalate to our team.", t1: "0.9s", t2: "1.4s" };
  return { tag: "normal · general", draft: "Thanks for getting in touch. Could you share a little more detail so we can help?", t1: "0.7s", t2: "1.2s" };
}

function lineChart(d, labels) {
  const W = 560, H = 170, P = 30, max = Math.max(...d) * 1.18, step = (W - 2 * P) / (d.length - 1);
  const pts = d.map((v, i) => [P + i * step, H - P - (v / max) * (H - 2 * P)]);
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Line chart of runs per day: ${labels.map((l, i) => l + " " + d[i]).join(", ")}" style="width:100%;height:auto;max-width:640px;display:block">
    <g stroke="var(--line)" stroke-width="1">${[0, .5, 1].map(f => `<line x1="${P}" x2="${W - P}" y1="${H - P - f * (H - 2 * P)}" y2="${H - P - f * (H - 2 * P)}"/>`).join("")}</g>
    <polyline points="${pts.map(p => p.join(",")).join(" ")}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round"/>
    ${pts.map(([x, y], i) => `<circle cx="${x}" cy="${y}" r="4" fill="var(--surface)" stroke="var(--accent)" stroke-width="2"/><text x="${x}" y="${y - 10}" text-anchor="middle" font-size="12" fill="var(--text)" font-family="JetBrains Mono, monospace">${d[i]}</text><text x="${x}" y="${H - 8}" text-anchor="middle" font-size="12" fill="var(--muted)">${labels[i]}</text>`).join("")}
  </svg>`;
}
